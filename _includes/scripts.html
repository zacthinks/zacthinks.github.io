<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

<script>
// Accordion using Web Animations API (reference implementation adapted)
class Accordion {
	constructor(el) {
		this.el = el;
		this.summary = el.querySelector('summary');
		// find or create .content wrapper
		this.content = el.querySelector('.content');
		if (!this.content) {
			// wrap any nodes after summary into .content
			const wrapper = document.createElement('div');
			wrapper.className = 'content';
			let node = this.summary.nextSibling;
			while (node) {
				const next = node.nextSibling;
				wrapper.appendChild(node);
				node = next;
			}
			el.appendChild(wrapper);
			this.content = wrapper;
		}

		this.animation = null;
		this.isClosing = false;
		this.isExpanding = false;
		this.summary.addEventListener('click', (e) => this.onClick(e));
	}

	onClick(e) {
		e.preventDefault();
		this.el.style.overflow = 'hidden';
		if (this.isClosing || !this.el.open) {
			this.open();
		} else if (this.isExpanding || this.el.open) {
			this.shrink();
		}
	}

	shrink() {
		this.isClosing = true;
		const startHeight = `${this.el.offsetHeight}px`;
		const endHeight = `${this.summary.offsetHeight}px`;
		if (this.animation) this.animation.cancel();
		this.animation = this.el.animate({ height: [startHeight, endHeight] }, { duration: 400, easing: 'ease-out' });
		this.animation.onfinish = () => this.onAnimationFinish(false);
		this.animation.oncancel = () => this.isClosing = false;
	}

	open() {
		this.el.style.height = `${this.el.offsetHeight}px`;
		this.el.open = true;
		window.requestAnimationFrame(() => this.expand());
	}

	expand() {
		this.isExpanding = true;
		const startHeight = `${this.el.offsetHeight}px`;
		const endHeight = `${this.summary.offsetHeight + this.content.offsetHeight}px`;
		if (this.animation) this.animation.cancel();
		this.animation = this.el.animate({ height: [startHeight, endHeight] }, { duration: 400, easing: 'ease-out' });
		this.animation.onfinish = () => this.onAnimationFinish(true);
		this.animation.oncancel = () => this.isExpanding = false;
	}

	onAnimationFinish(open) {
		this.el.open = open;
		this.animation = null;
		this.isClosing = false;
		this.isExpanding = false;
		this.el.style.height = this.el.style.overflow = '';
	}
}

document.addEventListener('DOMContentLoaded', function () {
	document.querySelectorAll('details').forEach((el) => new Accordion(el));
});
</script>
