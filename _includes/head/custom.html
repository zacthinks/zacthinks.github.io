{% include base_path %}

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css" />

<!-- Favicons: native light/dark support -->
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-light.png?v={{ site.time | date: '%s' }}"
  media="(prefers-color-scheme: light)">

<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-dark.png?v={{ site.time | date: '%s' }}"
  media="(prefers-color-scheme: dark)">

<!-- JS fallback for browsers that ignore media queries on favicons -->
<script>
  (function () {
    var lightIcon = "{{ base_path }}/images/favicon-light.png?v={{ site.time | date: '%s' }}";
    var darkIcon = "{{ base_path }}/images/favicon-dark.png?v={{ site.time | date: '%s' }}";

    function setFavicon(isDark) {
      // Remove any existing favicons
      var links = document.querySelectorAll('link[rel="icon"]');
      links.forEach(function (link) {
        link.parentNode.removeChild(link);
      });

      // Insert a fresh one
      var link = document.createElement("link");
      link.rel = "icon";
      link.type = "image/png";
      link.href = isDark ? darkIcon : lightIcon;
      document.head.appendChild(link);
    }

    if (!window.matchMedia) {
      setFavicon(false);
      return;
    }

    var mql = window.matchMedia("(prefers-color-scheme: dark)");
    setFavicon(mql.matches);

    if (mql.addEventListener) {
      mql.addEventListener("change", function (e) {
        setFavicon(e.matches);
      });
    } else if (mql.addListener) {
      // Safari < 14
      mql.addListener(function (e) {
        setFavicon(e.matches);
      });
    }
  })();
</script>

<!-- end custom head snippets -->
